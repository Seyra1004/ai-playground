brand:
  name: "SWIPE_INFO"

canvas:
  width: 1080
  height: 1350
  ratio: "4:5"

colors:
  navy: "#16233F"
  orange: "#E8600A"
  violet: "#7848D8"
  light_purple: "#A848F0"
  magenta: "#F04890"
  coral: "#F06078"
  text_primary: "#1B2233"

backgrounds:
  warm_paper: "#FBF6EE"
  warm_paper_soft: "#F5EFE2"
  white: "#FFFFFF"
  light_lavender: "#F7F2FF"

typography:
  family: "Pretendard"

layout:
  safe_margin_left: 84
  safe_margin_right: 84
  safe_margin_top: 80
  safe_margin_bottom: 92

design_rules:
  max_strong_colors_per_page: 2
  full_background_gradient: false
  gradient_usage:
    - underline
    - page_number
    - accent_line

consistency:
  fixed_brand_system: true
  allow_daily_variation:
    - photo
    - layout_variant
    - accent_color
  prohibit_random_redesign: true