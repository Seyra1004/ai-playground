# SUPER NEWS source registry — declarative, secret-free.
#
# Location note: this lives at the project root (not config/sources.yaml)
# because `config.py` already occupies the `config` module name at this
# level; a `config/` package would collide with it. See the Phase 2A
# PRE-FLIGHT report for the full rationale.
#
# Each entry describes WHAT a source is, not HOW to call it in Python —
# adapter resolution (source_type -> adapter function) lives in
# ingestion/adapters/__init__.py, not here. No credential VALUES appear
# here, ever — only environment-variable NAMES via `credential_env`; the
# actual secret lives in .env / the real process environment.
#
# display_name / quality_tier (added 2026-08-14, credential-independent
# architecture pass): this is now the SINGLE source of truth for a source's
# reader-facing name and editorial quality tier -- report/web_render_v2.py
# no longer keeps its own hardcoded SOURCE_LABELS copy (see report/
# source_metadata.py, which merges this file with music/registry.py's chart
# sources into one lookup). Adding a new source here requires no renderer
# change to display it correctly.
#
# quality_tier is a ranking SIGNAL, not a hard ordering rule -- an
# official/TIER_1 source does not automatically outrank a fresher TIER_3
# story (see report/candidate_selection.py's final_score, where freshness
# is still the primary weight). Tiers:
#   TIER_1 - primary/official (the entity's own newsroom, an official
#            platform chart, or a government/central-bank press office)
#   TIER_2 - established major newsroom (national wire service, major
#            mainstream outlet with its own reporting staff)
#   TIER_3 - reputable specialist/trade press, or a news aggregator API
#            whose underlying outlets aren't individually distinguished
#   TIER_4 - secondary/aggregator (a search-RSS proxy standing in for a
#            platform with no real newsroom feed of its own)

sources:
  - source_name: openai_news_rss
    enabled: true
    source_type: rss
    category: AI_NEWS
    region: GLOBAL
    display_name: OpenAI
    quality_tier: TIER_1
    endpoint: https://openai.com/news/rss.xml
    timeout_seconds: 10
    retry:
      max_attempts: 3
      backoff_base_seconds: 1.0
      backoff_jitter_seconds: 0.5
    auth:
      mode: none

  # AI_NEWS source diversity (2026-08-14): openai_news_rss alone is a
  # single-vendor source -- these two add independent, reputable tech-press
  # coverage of the wider AI industry (not just OpenAI's own announcements).
  # Both verified reachable (HTTP 200, real current entries) by direct probe
  # before being added -- same due-diligence standard as every other source
  # in this file. the_verge_ai_rss is an Atom feed; source_type: rss is
